<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">FeelRate Entity Relationship Diagram</title>
  <desc id="desc">FeelRate MySQL ERD containing Restaurant, Menu, Review, User, and RefreshToken</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#F4F0FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#635BFF"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#27304A" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#172033}
      .subtitle{font:400 19px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#69738D}
      .section{font:700 16px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#7C85A3;letter-spacing:2px}
      .entity{font:700 24px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#172033}
      .entity-light{font:700 24px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:white}
      .field{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#536078}
      .field-light{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#F3F0FF}
      .type{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#929BB0}
      .type-light{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#DCD7FF}
      .key{font:700 12px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:white}
      .relation{font:700 17px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#5D6680}
      .note{font:500 15px -apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;fill:#69738D}
      .line{fill:none;stroke:#7C85A3;stroke-width:3}
      .logical{fill:none;stroke:#9DA5BA;stroke-width:3;stroke-dasharray:9 8}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1460" cy="80" r="235" fill="#DCD6FF" opacity="0.38"/>
  <circle cx="80" cy="930" r="265" fill="#D9E8FF" opacity="0.4"/>

  <text x="90" y="82" class="title">FeelRate Entity Relationship Diagram</text>
  <text x="90" y="118" class="subtitle">Spring Data JPA 기반 음식점 추천 서비스 데이터 모델</text>
  <text x="90" y="177" class="section">CORE DOMAIN</text>

  <!-- Restaurant -->
  <rect x="90" y="205" width="480" height="522" rx="26" fill="url(#primary)" filter="url(#shadow)"/>
  <circle cx="138" cy="255" r="24" fill="white" opacity="0.16"/>
  <path d="M126 249h24v16h-24z M130 245h16 M132 265v7 M144 265v7" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <text x="178" y="263" class="entity-light">Restaurant</text>
  <text x="515" y="261" text-anchor="end" class="type-light">restaurant</text>
  <line x1="120" y1="290" x2="540" y2="290" stroke="white" opacity="0.22"/>
  <rect x="122" y="312" width="33" height="22" rx="11" fill="#F6B73C"/><text x="138" y="328" text-anchor="middle" class="key">PK</text>
  <text x="170" y="329" class="field-light">placeId</text><text x="520" y="329" text-anchor="end" class="type-light">INTEGER</text>
  <text x="122" y="371" class="field-light">name</text><text x="520" y="371" text-anchor="end" class="type-light">VARCHAR · NOT NULL</text>
  <text x="122" y="413" class="field-light">address</text><text x="520" y="413" text-anchor="end" class="type-light">VARCHAR</text>
  <text x="122" y="455" class="field-light">rating</text><text x="520" y="455" text-anchor="end" class="type-light">DOUBLE</text>
  <text x="122" y="497" class="field-light">reviewCount</text><text x="520" y="497" text-anchor="end" class="type-light">INTEGER</text>
  <text x="122" y="539" class="field-light">url</text><text x="520" y="539" text-anchor="end" class="type-light">VARCHAR(1000)</text>
  <text x="122" y="581" class="field-light">latitude</text><text x="520" y="581" text-anchor="end" class="type-light">DOUBLE</text>
  <text x="122" y="623" class="field-light">longitude</text><text x="520" y="623" text-anchor="end" class="type-light">DOUBLE</text>
  <text x="122" y="665" class="field-light">category</text><text x="520" y="665" text-anchor="end" class="type-light">VARCHAR</text>

  <!-- Menu -->
  <rect x="790" y="205" width="390" height="286" rx="26" fill="white" filter="url(#shadow)"/>
  <circle cx="838" cy="255" r="24" fill="#FFF4DE"/>
  <path d="M831 242v25 M838 242v25 M831 253h7 M849 242v25" fill="none" stroke="#DD921C" stroke-width="3" stroke-linecap="round"/>
  <text x="878" y="263" class="entity">Menu</text><text x="1135" y="261" text-anchor="end" class="type">menu</text>
  <line x1="820" y1="290" x2="1150" y2="290" stroke="#E3E7F0"/>
  <rect x="822" y="312" width="33" height="22" rx="11" fill="#F6B73C"/><text x="838" y="328" text-anchor="middle" class="key">PK</text>
  <text x="870" y="329" class="field">id</text><text x="1130" y="329" text-anchor="end" class="type">BIGINT · AI</text>
  <text x="822" y="371" class="field">name</text><text x="1130" y="371" text-anchor="end" class="type">VARCHAR</text>
  <text x="822" y="413" class="field">price</text><text x="1130" y="413" text-anchor="end" class="type">VARCHAR</text>
  <rect x="822" y="438" width="33" height="22" rx="11" fill="#38A978"/><text x="838" y="454" text-anchor="middle" class="key">FK</text>
  <text x="870" y="455" class="field">restaurant_id</text><text x="1130" y="455" text-anchor="end" class="type">INTEGER</text>

  <!-- Review -->
  <rect x="790" y="535" width="390" height="238" rx="26" fill="white" filter="url(#shadow)"/>
  <circle cx="838" cy="585" r="24" fill="#EAF3FF"/>
  <path d="M826 574h24v17h-13l-7 6v-6h-4z" fill="none" stroke="#3977C3" stroke-width="3" stroke-linejoin="round"/>
  <text x="878" y="593" class="entity">Review</text><text x="1135" y="591" text-anchor="end" class="type">review</text>
  <line x1="820" y1="620" x2="1150" y2="620" stroke="#E3E7F0"/>
  <rect x="822" y="642" width="33" height="22" rx="11" fill="#F6B73C"/><text x="838" y="658" text-anchor="middle" class="key">PK</text>
  <text x="870" y="659" class="field">id</text><text x="1130" y="659" text-anchor="end" class="type">BIGINT · AI</text>
  <rect x="822" y="680" width="33" height="22" rx="11" fill="#38A978"/><text x="838" y="696" text-anchor="middle" class="key">FK</text>
  <text x="870" y="697" class="field">restaurant_id</text><text x="1130" y="697" text-anchor="end" class="type">INTEGER</text>
  <text x="822" y="739" class="field">text</text><text x="1130" y="739" text-anchor="end" class="type">LONGTEXT</text>

  <!-- Relationships -->
  <path d="M570 335 H700 V335 H790" class="line"/>
  <line x1="590" y1="322" x2="590" y2="348" stroke="#7C85A3" stroke-width="3"/>
  <path d="M765 319 L790 335 L765 351 M775 319 V351" fill="none" stroke="#7C85A3" stroke-width="3"/>
  <rect x="650" y="308" width="62" height="28" rx="14" fill="#F0EEFF"/><text x="681" y="328" text-anchor="middle" class="relation">1 : N</text>
  <text x="681" y="363" text-anchor="middle" class="note">menus</text>
  <path d="M570 610 H700 V650 H790" class="line"/>
  <line x1="590" y1="597" x2="590" y2="623" stroke="#7C85A3" stroke-width="3"/>
  <path d="M765 634 L790 650 L765 666 M775 634 V666" fill="none" stroke="#7C85A3" stroke-width="3"/>
  <rect x="650" y="603" width="62" height="28" rx="14" fill="#F0EEFF"/><text x="681" y="623" text-anchor="middle" class="relation">1 : N</text>
  <text x="681" y="660" text-anchor="middle" class="note">reviews</text>

  <!-- Auth domain -->
  <text x="1240" y="177" class="section">AUTH DOMAIN</text>
  <rect x="1240" y="205" width="280" height="286" rx="26" fill="white" filter="url(#shadow)"/>
  <circle cx="1285" cy="255" r="23" fill="#ECFDF3"/>
  <circle cx="1285" cy="249" r="7" fill="none" stroke="#24A06B" stroke-width="3"/><path d="M1273 269c2-9 22-9 24 0" fill="none" stroke="#24A06B" stroke-width="3" stroke-linecap="round"/>
  <text x="1322" y="263" class="entity">User</text><text x="1480" y="261" text-anchor="end" class="type">users</text>
  <line x1="1268" y1="290" x2="1492" y2="290" stroke="#E3E7F0"/>
  <rect x="1270" y="312" width="33" height="22" rx="11" fill="#F6B73C"/><text x="1286" y="328" text-anchor="middle" class="key">PK</text>
  <text x="1315" y="329" class="field">id</text><text x="1475" y="329" text-anchor="end" class="type">BIGINT · AI</text>
  <text x="1270" y="371" class="field">email</text><text x="1475" y="371" text-anchor="end" class="type">UNIQUE</text>
  <text x="1270" y="413" class="field">name</text><text x="1475" y="413" text-anchor="end" class="type">VARCHAR</text>
  <text x="1270" y="455" class="field">password</text><text x="1475" y="455" text-anchor="end" class="type">VARCHAR</text>

  <rect x="1240" y="565" width="280" height="238" rx="26" fill="white" filter="url(#shadow)"/>
  <circle cx="1285" cy="615" r="23" fill="#FFECEF"/>
  <path d="M1277 615a8 8 0 1 1 8 8h-4v7 M1281 630h8" fill="none" stroke="#E64155" stroke-width="3" stroke-linecap="round"/>
  <text x="1322" y="623" class="entity">RefreshToken</text>
  <line x1="1268" y1="650" x2="1492" y2="650" stroke="#E3E7F0"/>
  <rect x="1270" y="672" width="33" height="22" rx="11" fill="#F6B73C"/><text x="1286" y="688" text-anchor="middle" class="key">PK</text>
  <text x="1315" y="689" class="field">id</text><text x="1475" y="689" text-anchor="end" class="type">BIGINT</text>
  <text x="1270" y="731" class="field">userId</text><text x="1475" y="731" text-anchor="end" class="type">UNIQUE</text>
  <text x="1270" y="773" class="field">refreshToken</text><text x="1475" y="773" text-anchor="end" class="type">VARCHAR</text>
  <path d="M1380 491 V565" class="logical"/>
  <line x1="1367" y1="510" x2="1393" y2="510" stroke="#9DA5BA" stroke-width="3"/>
  <line x1="1367" y1="548" x2="1393" y2="548" stroke="#9DA5BA" stroke-width="3"/>
  <rect x="1400" y="516" width="60" height="28" rx="14" fill="#F0EEFF"/><text x="1430" y="536" text-anchor="middle" class="relation">1 : 1</text>

  <!-- Legend -->
  <line x1="90" y1="875" x2="1520" y2="875" stroke="#DDE2EE" stroke-width="2"/>
  <text x="90" y="920" class="subtitle">Relationship</text>
  <line x1="235" y1="914" x2="300" y2="914" class="line"/><text x="315" y="920" class="note">물리적 FK 관계</text>
  <line x1="470" y1="914" x2="535" y2="914" class="logical"/><text x="550" y="920" class="note">논리적 관계 · JPA 연관관계 미지정</text>
  <rect x="1325" y="898" width="88" height="32" rx="16" fill="#ECE9FF"/><text x="1369" y="920" text-anchor="middle" style="font:600 15px -apple-system,BlinkMacSystemFont,'Pretendard',sans-serif;fill:#5348D7">FeelRate</text>
</svg>
